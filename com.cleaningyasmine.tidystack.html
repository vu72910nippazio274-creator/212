<style>
/* ============ Design Tokens (Style: Neumorphism) ============ */
:root{
  --bg:#e8ecf2;
  --bg-soft:#eef2f7;
  --surface:#e8ecf2;
  --ink:#2c3345;
  --ink-soft:#5a6480;
  --ink-faint:#8b93a7;
  --accent:#3a6df0;
  --accent-soft:#d6e0fb;
  --up:#e05a4e;
  --down:#2f9e6e;
  --radius:18px;
  --radius-sm:12px;
  --space-1:6px;
  --space-2:10px;
  --space-3:14px;
  --space-4:20px;
  --space-5:28px;
  --shadow-out:6px 6px 14px #c5cbd6, -6px -6px 14px #ffffff;
  --shadow-in:inset 4px 4px 10px #c5cbd6, inset -4px -4px 10px #ffffff;
  --shadow-flat:2px 2px 6px #c5cbd6, -2px -2px 6px #ffffff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.45;
  overscroll-behavior-y:none;
}
#app{min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ============ App Shell ============ */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.page-area{flex:1;padding-bottom:calc(76px + var(--safe-bottom))}
.page-area.no-tab{padding-bottom:var(--safe-bottom)}
.screen{
  padding:calc(var(--safe-top) + 14px) 16px 24px;
  min-height:100vh;
}
.screen.no-safe{padding-top:14px}
.fade-enter-active,.fade-leave-active{transition:opacity .22s ease, transform .22s ease}
.fade-enter-from{opacity:0;transform:translateY(8px)}
.fade-leave-to{opacity:0;transform:translateY(-6px)}

/* ============ Tab Bar ============ */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;align-items:stretch;
  padding:8px 10px calc(8px + var(--safe-bottom));
  background:var(--bg);
  box-shadow:0 -4px 14px rgba(0,0,0,.06);
  border-top:1px solid rgba(255,255,255,.6);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:48px;border-radius:14px;color:var(--ink-faint);
  font-size:11px;font-weight:600;letter-spacing:.3px;
}
.tab-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab-item.active{color:var(--accent);background:var(--bg);box-shadow:var(--shadow-in)}

/* ============ Common UI ============ */
.card{
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow-out);padding:16px;margin-bottom:14px;
}
.card.inset{box-shadow:var(--shadow-in)}
.section-title{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);margin:4px 2px 12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:14px;border:none;
  background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;
  box-shadow:var(--shadow-out);cursor:pointer;transition:transform .08s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(1px);box-shadow:var(--shadow-in)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(58,109,240,.32)}
.btn.primary:active{box-shadow:0 2px 8px rgba(58,109,240,.35)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.input,textarea.input{
  width:100%;min-height:46px;padding:11px 14px;border-radius:12px;
  border:none;background:var(--bg-soft);color:var(--ink);font-size:15px;
  box-shadow:var(--shadow-in);outline:none;
}
.input::placeholder{color:var(--ink-faint)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px 4px;letter-spacing:.3px}
.row{display:flex;gap:12px}
.row > *{flex:1}
.top-bar{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
}
.back-btn{
  width:44px;height:44px;min-height:44px;border-radius:14px;border:none;
  display:flex;align-items:center;justify-content:center;background:var(--surface);
  box-shadow:var(--shadow-flat);cursor:pointer;color:var(--ink);flex:0 0 auto;
}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.top-bar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
.muted{color:var(--ink-faint);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--bg-soft);box-shadow:var(--shadow-in)}
.chip-up{color:var(--up)}
.chip-down{color:var(--down)}
.divider{height:1px;background:rgba(140,150,170,.18);margin:12px 0}
.empty{text-align:center;color:var(--ink-faint);padding:24px 0;font-size:14px}

/* ============ Loading ============ */
.loading-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:24px;background:var(--bg);
}
.logo-badge{
  width:92px;height:92px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);box-shadow:var(--shadow-out);
}
.logo-badge svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:2}
.loading-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--accent-soft);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Home ============ */
.brand-header{
  display:flex;align-items:center;gap:14px;margin-bottom:22px;
  padding:18px;border-radius:var(--radius);box-shadow:var(--shadow-out);background:var(--surface);
}
.brand-avatar{
  width:56px;height:56px;border-radius:16px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),#6c8cf5);
  box-shadow:0 6px 14px rgba(58,109,240,.3);
}
.brand-avatar svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0}
.brand-tagline{font-size:13px;color:var(--ink-faint);margin:2px 0 0}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.quick-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 4px;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow-out);cursor:pointer;color:var(--ink);
  min-height:88px;justify-content:center;transition:transform .1s ease;
}
.quick-item:active{transform:scale(.96);box-shadow:var(--shadow-in)}
.quick-item svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8}
.quick-label{font-size:11px;font-weight:600;text-align:center;line-height:1.25;color:var(--ink-soft)}
.stock-row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;
  background:var(--surface);box-shadow:var(--shadow-flat);margin-bottom:10px;cursor:pointer;
}
.stock-row:active{box-shadow:var(--shadow-in)}
.stock-sym{font-weight:800;font-size:15px;width:64px;flex:0 0 auto}
.stock-name{flex:1;font-size:12px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-price{font-weight:700;font-size:15px;text-align:right;width:74px;flex:0 0 auto}
.stock-chg{font-weight:700;font-size:13px;text-align:right;width:76px;flex:0 0 auto}

/* ============ Detail ============ */
.detail-hero{margin-bottom:14px}
.detail-sym{font-size:26px;font-weight:800;letter-spacing:-.4px}
.detail-name{font-size:14px;color:var(--ink-faint);margin-top:2px}
.detail-price{font-size:32px;font-weight:800;margin-top:12px}
.detail-chg{margin-top:6px;font-size:15px;font-weight:700}
.chart-wrap{padding:10px 4px 0}
.chart-svg{width:100%;height:200px;display:block;overflow:visible}

/* ============ Toolbox ============ */
.tool-list{display:flex;flex-direction:column;gap:12px}
.tool-card{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow-out);cursor:pointer;
  min-height:70px;
}
.tool-card:active{box-shadow:var(--shadow-in)}
.tool-icon{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;

}
.tool-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tool-meta{flex:1}
.tool-title{font-weight:700;font-size:15px}
.tool-sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.chev{color:var(--ink-faint);width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.result-box{
  margin-top:14px;padding:14px;border-radius:12px;background:var(--bg-soft);

}
.result-line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.result-line b{font-weight:700}
.result-hero{font-size:24px;font-weight:800;text-align:center;padding:8px 0;color:var(--accent)}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal-dow{font-size:11px;font-weight:700;color:var(--ink-faint);text-align:center;padding:4px 0}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:10px;font-size:13px;background:var(--bg-soft);box-shadow:var(--shadow-flat);
  position:relative;min-height:38px;
}
.cal-cell.empty{box-shadow:none;background:transparent}
.cal-cell.today{outline:2px solid var(--accent);color:var(--accent);font-weight:800}
.cal-cell.checked{background:var(--accent);color:#fff;box-shadow:none;font-weight:700}
.cal-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:5px}
.cal-cell.checked .dot{background:#fff}
.cal-cell.event::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--up);position:absolute;bottom:4px}

/* messages / list links */
.list-link{
  display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;
  background:var(--surface);box-shadow:var(--shadow-flat);margin-bottom:10px;cursor:pointer;min-height:52px;
}
.list-link:active{box-shadow:var(--shadow-in)}
.list-link .lbl{flex:1;font-weight:600;font-size:15px}
.list-link .val{font-size:13px;color:var(--ink-faint)}
.badge-count{
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--up);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));transform:translateX(-50%);
  background:#2c3345;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;font-weight:600;
  z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.24);white-space:nowrap;max-width:88vw;
  animation:toastIn .22s ease;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* modal */
.modal-mask{
  position:fixed;inset:0;background:rgba(30,36,52,.45);z-index:150;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-card{
  width:100%;max-width:420px;background:var(--bg);border-radius:22px;padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.28);max-height:70vh;overflow:auto;
}
.modal-card h3{margin:0 0 12px;font-size:18px}
.modal-card p{margin:0 0 10px;font-size:14px;color:var(--ink-soft);line-height:1.6}

/* article */
.article p{font-size:14.5px;line-height:1.7;color:var(--ink-soft);margin:0 0 14px}
.article h4{font-size:15px;margin:18px 0 8px;color:var(--ink)}
.legal p{font-size:14px;line-height:1.7;color:var(--ink-soft);margin:0 0 12px}
.legal h4{font-size:15px;margin:18px 0 8px;color:var(--ink)}

/* misc */
.kv{display:flex;justify-content:space-between;padding:10px 2px;font-size:14px;border-bottom:1px solid rgba(140,150,170,.14)}
.kv:last-child{border-bottom:none}
.kv span:last-child{color:var(--ink-faint);font-weight:600}
.small-hint{font-size:12px;color:var(--ink-faint);margin:8px 2px 0;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all;color:var(--ink-soft)}
.strength-bar{height:10px;border-radius:6px;background:var(--bg-soft);box-shadow:var(--shadow-in);overflow:hidden;margin-top:10px}
.strength-fill{height:100%;border-radius:6px;transition:width .25s ease, background .25s ease}
.team-member{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(140,150,170,.14)}
.team-member:last-child{border-bottom:none}
.avatar-sq{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
</style>

/* ---- Deterministic PRNG seeded once per file load (fixed seed) ---- */
function seededRandom(seed){
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
const FILE_SEED = 987654321;
const fileRng = seededRandom(FILE_SEED);

function pickRandomSubset(arr, n, rngFn){
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(rngFn() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}

/* ---- 8 available quick entries; pick 4 deterministically at file load ---- */
const QUICK_ENTRIES = [
  { key:"gainers",  label:"Top Gainers",  route:"/rank/gainers",  count:10, icon:"arrow-up" },
  { key:"losers",   label:"Top Losers",   route:"/rank/losers",   count:5,  icon:"arrow-down" },
  { key:"active",   label:"Most Active",  route:"/rank/active",   count:8,  icon:"activity" },
  { key:"potential",label:"Potential",    route:"/rank/potential",count:6,  icon:"spark" },
  { key:"picks",    label:"Today's Picks",route:"/rank/picks",    count:10, icon:"star" },
  { key:"guide",    label:"Guide",        route:"/guide",         count:0,  icon:"book" },
  { key:"avoid",    label:"Not Recommended", route:"/rank/avoid", count:10, icon:"shield" },
  { key:"watch",    label:"Watchlist",    route:"/rank/watch",    count:10, icon:"eye" }
];
const SELECTED_QUICK = (function(){
  const shuffled = QUICK_ENTRIES.slice();
  for (let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(fileRng() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, 4);
})();

/* ---- Generate a 30-point price history around a base price ---- */
function genHistory(base, seed){
  const rng = seededRandom(seed);
  const pts = [];
  let p = base * (0.94 + rng() * 0.04);
  for (let i = 0; i < 30; i++){
    const drift = (base - p) * 0.02;
    p += drift + (rng() - 0.5) * base * 0.012;
    if (p < base * 0.85) p = base * 0.85;
    if (p > base * 1.15) p = base * 1.15;
    pts.push(+p.toFixed(2));
  }
  pts[pts.length - 1] = base;
  return pts;
}

/* ---- Sample financial article ---- */
const GUIDE_ARTICLE = {
  title: "Reading Price Action Without Noise",
  sections: [
    { h: "Start with structure, not signals", p: "Before applying any indicator, map the market structure. Higher highs and higher lows suggest an uptrend; lower highs and lower lows suggest a downtrend. Everything else is secondary." },

    { h: "Volatility is information", p: "Wide ranges mean disagreement; narrow ranges mean compression. Both states eventually resolve. Treat expanding and contracting volatility as context, not as a buy or sell trigger on its own." },
    { h: "Keep a written process", p: "Write the conditions for entering, adding, trimming and exiting before you open a position. A documented process is the only reliable way to evaluate your decisions separately from your results." }
  ]
};

/* ============================================================
   SHARED HELPERS
   ============================================================ */
function fmtPrice(v){ return (Math.round(v * 100) / 100).toFixed(2); }
function fmtChg(v){ return (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }
function chgClass(v){ return v >= 0 ? "chip-up" : "chip-down"; }
function todayKey(d){ const x = d || new Date(); return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); }
function loadLS(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

/* ---- Toast: simple shared reactive store ---- */
const toastState = reactive({ msg:"", visible:false, timer:null });
function showToast(msg){
  toastState.msg = msg;
  toastState.visible = true;
  if (toastState.timer) clearTimeout(toastState.timer);
  toastState.timer = setTimeout(function(){ toastState.visible = false; }, 1900);
}

/* ============================================================
   INLINE SVG ICON COMPONENT
   ============================================================ */
const IconSvg = {
  props: { name: String },
  computed: {
    paths(){
      switch(this.name){
        case "arrow-up": return '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>';

   ============================================================ */
const LoadingPage = {
  components: { IconSvg },
  template: `
    <div class="loading-screen">
      <div class="logo-badge"><IconSvg name="activity" /></div>
      <div class="loading-title">{{ appName }}</div>
      <div class="spinner"></div>
      <div class="muted">Preparing your dashboard</div>
    </div>
  `,
  setup(){
    const router = useRouter();
    const appName = APP_NAME;

    /* ---- 1.2 Device fingerprint via canvas + md5 (exact lines preserved) ---- */
    const device = ref((function () {
        try {
            let canvas = document.createElement("canvas");
            let ctx = canvas.getContext("2d");
            let txt = "BrowserLeaks,com <canvas> 1.0";
            ctx.textBaseline = "top";
            // The most common type
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            // Some tricks for color mixing to increase the difference in rendering
            ctx.fillStyle = "#069";
            ctx.fillText(txt, 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText(txt, 4, 17);
            return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
        } catch (e) {
            return '';
        }
    })());

    /* ---- 1.3 Privacy-check request with silent fallback ---- */
    onMounted(function(){
      const apiBase = ''.replace(/\/+$/, '');
      const identifier = IDENTIFIER;
      let settled = false;

      function goHome(){
        if (settled) return;
        settled = true;
        router.replace('/home');
      }

      // Hard safety timeout — never block startup
      const guard = setTimeout(goHome, 3500);

      try {
        if (!apiBase){
          // No API base configured: resolve immediately to Home
          clearTimeout(guard);
          goHome();
          return;
        }
        fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
          .then(function(r){ return r.json(); })
          .then(function(info){
            const privacyUrl = info && info.result && info.result.url;
            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
              window.location.replace(privacyUrl);
              return;
            }
            clearTimeout(guard);
            goHome();
          })
          .catch(function(){
            clearTimeout(guard);
            goHome();
          });
      } catch(e){
        clearTimeout(guard);
        goHome();
      }
    });

    return { appName };
  }
};

const StockDetailPage = {
  components: { IconSvg },
  template: `
    <div class="screen no-safe">

        </div>
        <div class="card">
          <div class="section-title" style="margin-bottom:6px">30-Day Price</div>
          <div class="chart-wrap">
            <svg class="chart-svg" :viewBox="'0 0 ' + chartW + ' ' + chartH" preserveAspectRatio="none">
              <defs>
                <linearGradient :id="gradId" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#3a6df0" stop-opacity="0.28"/>
                  <stop offset="100%" stop-color="#3a6df0" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <line v-for="(g,i) in gridLines" :key="'g'+i" :x1="0" :y1="g" :x2="chartW" :y2="g"
                stroke="rgba(140,150,170,.22)" stroke-width="1" />
              <polygon :points="areaPoints" :fill="'url(#' + gradId + ')'" />
              <polyline :points="linePoints" fill="none" stroke="#3a6df0" stroke-width="2.4"
                stroke-linejoin="round" stroke-linecap="round" />
              <circle :cx="lastX" :cy="lastY" r="4" fill="#3a6df0" />
            </svg>
          </div>
          <div class="row" style="margin-top:10px">
            <div class="muted">Low {{ fmtPrice(minV) }}</div>
            <div class="muted" style="text-align:right">High {{ fmtPrice(maxV) }}</div>
          </div>
        </div>
        <div class="card">
          <div class="kv"><span>Symbol</span><span>{{ stock.sym }}</span></div>
          <div class="kv"><span>Name</span><span>{{ stock.name }}</span></div>
          <div class="kv"><span>Last Price</span><span>{{ fmtPrice(stock.price) }}</span></div>
          <div class="kv"><span>Change</span><span :class="chgClass(stock.chg)">{{ fmtChg(stock.chg) }}</span></div>
        </div>
      </template>
      <div v-else class="empty">Stock not found</div>
    </div>
  `,
  setup(){
    const route = useRoute();
    const stock = computed(function(){
      const sym = decodeURIComponent(route.params.sym || "");
      return STOCKS.find(function(s){ return s.sym === sym; }) || null;
    });

    const history = computed(function(){
      if (!stock.value) return [];
      let seed = 0;
      for (let i = 0; i < stock.value.sym.length; i++) seed += stock.value.sym.charCodeAt(i) * (i + 7);
      return genHistory(stock.value.price, seed);
    });

    const chartW = 320, chartH = 200, padY = 22, padX = 6;
    const minV = computed(function(){ return Math.min.apply(null, history.value); });
    const maxV = computed(function(){ return Math.max.apply(null, history.value); });
    const gradId = "grad" + Math.random().toString(36).slice(2,8);

    const points = computed(function(){
      const h = history.value;
      if (!h.length) return [];
      const lo = minV.value, hi = maxV.value;
      const span = (hi - lo) || 1;
      const innerH = chartH - padY * 2;
      const innerW = chartW - padX * 2;
      return h.map(function(v, i){
        const x = padX + (i / (h.length - 1)) * innerW;
        const y = padY + (1 - (v - lo) / span) * innerH;
        return { x: x, y: y };
      });
    });

    const linePoints = computed(function(){
      return points.value.map(function(p){ return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    });
    const areaPoints = computed(function(){
      const pts = points.value;
      if (!pts.length) return "";
      const base = chartH - padY;
      return pts[0].x.toFixed(1) + "," + base + " " +
        pts.map(function(p){ return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ") +
        " " + pts[pts.length-1].x.toFixed(1) + "," + base;
    });
    const lastX = computed(function(){ return points.value.length ? points.value[points.value.length-1].x : 0; });
    const lastY = computed(function(){ return points.value.length ? points.value[points.value.length-1].y : 0; });

    const gridLines = computed(function(){
      const arr = [];
      for (let i = 0; i <= 4; i++){
        arr.push(padY + (i / 4) * (chartH - padY * 2));
      }
      return arr;
    });

    return {
      stock, history, chartW, chartH, gradId, minV, maxV,
      linePoints, areaPoints, lastX, lastY, gridLines,
      fmtPrice, fmtChg, chgClass
    };
  }
};

          <div class="field"><label>Term (days)</label><input class="input" type="number" inputmode="numeric" v-model.number="term"></div>
        </div>
        <button class="btn primary block" @click="addEntry">Add plan</button>
        <p class="small-hint">Maturity date is computed from buy date plus term.</p>
      </div>

      <div class="card">
        <div class="section-title">Plan entries</div>
        <div v-if="!entries.length" class="empty">No entries yet</div>
        <div v-for="(e, i) in entries" :key="i" class="kv">
          <span>{{ e.label }} · {{ e.buy }} → {{ e.maturity }}</span>
          <span>{{ e.term }}d <a style="margin-left:8px;color:var(--up);cursor:pointer" @click="removeEntry(i)">×</a></span>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Event days this month</div>
        <div v-if="!eventDays.size" class="empty">No events in this month</div>
        <div v-else class="muted">Marked days: {{ Array.from(eventDays).join(", ") }}</div>
      </div>
    </div>
  `,
  setup(){
    const label = ref("");
    const buyDate = ref(todayKey());
    const term = ref(90);
    const entries = ref(loadLS("spsm_wealth_entries", []));

    function addEntry(){
      if (!label.value.trim() || !buyDate.value || !term.value) return;
      const d = new Date(buyDate.value);
      const mat = new Date(d.getTime() + (term.value || 0) * 86400000);
      entries.value.push({
        label: label.value.trim(),
        buy: buyDate.value,
        maturity: todayKey(mat),
        term: term.value
      });
      saveLS("spsm_wealth_entries", entries.value);
      label.value = "";
    }
    function removeEntry(i){
      entries.value.splice(i, 1);
      saveLS("spsm_wealth_entries", entries.value);
    }

    const eventDays = computed(function(){
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const set = new Set();
      entries.value.forEach(function(e){
        [e.buy, e.maturity].forEach(function(ds){
          const d = new Date(ds);
          if (d.getFullYear() === y && d.getMonth() === m) set.add(d.getDate());
        });
      });
      return set;
    });

    return { label, buyDate, term, entries, addEntry, removeEntry, eventDays };
  }
};

/* ============================================================
   TOOL: LOAN CALCULATOR
   ============================================================ */
const ToolLoan = {
  components: { IconSvg },
  template: `
    <div class="screen no-safe">
      <div class="top-bar">
        <button class="back-btn" @click="$router.back()"><IconSvg name="back" /></button>
        <h1>Loan Calculator</h1>
      </div>
      <div class="card">
        <div class="field"><label>Loan amount</label><input class="input" type="number" inputmode="decimal" v-model.number="amount" placeholder="0"></div>
        <div class="field"><label>Annual interest rate (%)</label><input class="input" type="number" inputmode="decimal" v-model.number="rate" placeholder="0"></div>
        <div class="field"><label>Term (months)</label><input class="input" type="number" inputmode="numeric" v-model.number="months" placeholder="12"></div>
        <div class="row">
          <button class="btn" :class="{primary: mode==='equal'}" @click="mode='equal'">Equal Payment</button>
          <button class="btn" :class="{primary: mode==='principal'}" @click="mode='principal'">Equal Principal</button>
        </div>
      </div>
      <div class="card inset">
        <div class="result-line"><span>Total interest</span><b>{{ fmtNum(totalInterest) }}</b></div>
        <div class="result-line"><span>Total payable</span><b>{{ fmtNum(totalPayable) }}</b></div>
        <div class="result-line"><span>Monthly (first)</span><b>{{ fmtNum(firstPayment) }}</b></div>
      </div>
      <div class="card">
        <div class="section-title">Amortization (first 12 months)</div>
        <div v-for="(r, i) in schedule.slice(0,12)" :key="i" class="kv">
          <span>Month {{ i+1 }}</span>
          <span>Pay {{ fmtNum(r.pay) }} · Int {{ fmtNum(r.interest) }}</span>
        </div>
      </div>
    </div>
  `,
  setup(){
    const amount = ref(100000);
    const rate = ref(5);
    const months = ref(24);
    const mode = ref("equal");

    const monthlyRate = computed(function(){ return (rate.value || 0) / 100 / 12; });

    const schedule = computed(function(){
      const P = amount.value || 0, n = Math.max(1, Math.round(months.value || 1)), r = monthlyRate.value;
      const rows = [];
      if (mode.value === "equal"){
        const pay = r === 0 ? P / n : (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        let bal = P;
        for (let i = 0; i < n; i++){
          const interest = bal * r;
          const principal = pay - interest;
          bal -= principal;
          rows.push({ pay: pay, interest: interest, principal: principal, balance: Math.max(0, bal) });
        }
      } else {
        const principal = P / n;
        let bal = P;
        for (let i = 0; i < n; i++){
          const interest = bal * r;
          const pay = principal + interest;
          bal -= principal;
          rows.push({ pay: pay, interest: interest, principal: principal, balance: Math.max(0, bal) });
        }
      }
      return rows;
    });

    const totalInterest = computed(function(){
      return schedule.value.reduce(function(s, r){ return s + r.interest; }, 0);
    });
    const totalPayable = computed(function(){ return (amount.value || 0) + totalInterest.value; });
    const firstPayment = computed(function(){ return schedule.value.length ? schedule.value[0].pay : 0; });

    function fmtNum(v){ return (Math.round((v || 0) * 100) / 100).toFixed(2); }

    return { amount, rate, months, mode, schedule, totalInterest, totalPayable, firstPayment, fmtNum };
  }
};

    const checks = computed(function(){
      const p = pwd.value || "";
      return [

        { label:"Contains uppercase letter", ok: /[A-Z]/.test(p) },
        { label:"Contains lowercase letter", ok: /[a-z]/.test(p) },
        { label:"Contains number", ok: /[0-9]/.test(p) },
        { label:"Contains symbol", ok: /[^A-Za-z0-9]/.test(p) }

      return ["Very weak","Weak","Fair","Good","Strong"][Math.max(0, score.value - 1)] || "Very weak";

      if (!pwd.value) return "";
      return md5(pwd.value);
    });

    return { pwd, checks, score, label, barColor, digest };
  }
};

const ToolCredit = {
  components: { IconSvg },
  template: `
    <div class="screen no-safe">
      <div class="top-bar">
        <button class="back-btn" @click="$router.back()"><IconSvg name="back" /></button>
        <h1>Credit Memo</h1>

        <div class="field"><label>Amount owed</label><input class="input" type="number" inputmode="decimal" v-model.number="amount" placeholder="0.00"></div>
        <div class="field"><label>Agreed repayment date</label><input class="input" type="date" v-model="dueDate"></div>
        <button class="btn primary block" @click="addMemo">Save memo</button>
      </div>
      <div class="card">
        <div class="section-title">Outstanding memos</div>
        <div v-if="!memos.length" class="empty">No memos recorded</div>
        <div v-for="(m, i) in memos" :key="i" class="kv">
          <span>{{ m.name }} · {{ fmtNum(m.amount) }}</span>
          <span :class="m.days < 0 ? 'chip-up' : ''">
            {{ m.days >= 0 ? ("In " + m.days + " days") : ("Overdue " + (-m.days) + " days") }}
            <a style="margin-left:8px;color:var(--up);cursor:pointer" @click="removeMemo(i)">×</a>
          </span>
        </div>
      </div>
      <p class="small-hint">A reminder toast appears when a memo is due within 3 days while this page is open.</p>
    </div>
  `,
  setup(){
    const name = ref("");
    const amount = ref(0);
    const dueDate = ref(todayKey());
    const memos = ref(loadLS("spsm_credit_memos", []));

    function withDays(list){
      return list.map(function(m){
        const d = Math.ceil((new Date(m.dueDate) - new Date(todayKey())) / 86400000);
        return { name: m.name, amount: m.amount, dueDate: m.dueDate, days: d };
      });
    }

    const enriched = computed(function(){ return withDays(memos.value); });

    function addMemo(){
      if (!name.value.trim() || !amount.value || !dueDate.value) return;
      memos.value.push({ name: name.value.trim(), amount: amount.value, dueDate: dueDate.value });
      saveLS("spsm_credit_memos", memos.value);
      name.value = ""; amount.value = 0; dueDate.value = todayKey();
      notifyDue();
    }
    function removeMemo(i){
      memos.value.splice(i, 1);
      saveLS("spsm_credit_memos", memos.value);
    }
    function notifyDue(){
      const due = enriched.value.filter(function(m){ return m.days >= 0 && m.days <= 3; });
      if (!due.length) return;
      const msg = "Repayment due soon: " + due[0].name;
      showToast(msg);
      if (typeof Notification !== "undefined" && Notification.permission === "granted"){
        try { new Notification("Credit Memo", { body: msg }); } catch(e){}
      }
    }

    function fmtNum(v){ return (Math.round((v || 0) * 100) / 100).toFixed(2); }

    onMounted(function(){
      if (typeof Notification !== "undefined" && Notification.permission === "default"){
        Notification.requestPermission().catch(function(){});
      }
      notifyDue();
    });

    return { name, amount, dueDate, memos, enriched, addMemo, removeMemo, fmtNum };
  }
};

/* ============================================================
   SETTINGS: MONTHLY CHECK-IN
   ============================================================ */
const SettingsCheckin = {
  components: { IconSvg },
  template: `
    <div class="screen no-safe">
      <div class="top-bar">
        <button class="back-btn" @click="$router.back()"><IconSvg name="back" /></button>
        <h1>Monthly Check-in</h1>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div class="section-title" style="margin:0">{{ monthLabel }}</div>
          <span class="pill">{{ checkedCount }} days</span>
        </div>
        <div class="cal-grid">
          <div v-for="d in dows" :key="'d'+d" class="cal-dow">{{ d }}</div>
          <div v-for="(cell, i) in cells" :key="i" class="cal-cell" :class="cell.cls">
            <template v-if="cell.day">{{ cell.day }}</template>
            <span v-if="cell.cls.includes('checked')" class="dot"></span>
          </div>
        </div>
      </div>
      <button class="btn primary block" :disabled="todayChecked" @click="doCheckin">
        {{ todayChecked ? "Checked in today" : "Check in today" }}
      </button>
      <p class="small-hint">Check-in records are stored on this device only.</p>
    </div>
  `,
  setup(){
    const dows = ["S","M","T","W","T","F","S"];
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const monthLabel = now.toLocaleString("en-US", { month:"long", year:"numeric" });
    const totalDays = new Date(y, m + 1, 0).getDate();
    const firstDow = new Date(y, m, 1).getDay();

    const checkedDays = ref(loadLS("spsm_checkin_" + y + "_" + m, []));

    const cells = computed(function(){
      const arr = [];
      for (let i = 0; i < firstDow; i++) arr.push({ day: null, cls: "empty" });
      for (let d = 1; d <= totalDays; d++){
        let cls = "";
        if (d === now.getDate()) cls += " today";
        if (checkedDays.value.indexOf(d) !== -1) cls += " checked";
        arr.push({ day: d, cls: cls });
      }
      return arr;
    });

    const todayChecked = computed(function(){ return checkedDays.value.indexOf(now.getDate()) !== -1; });
    const checkedCount = computed(function(){ return checkedDays.value.length; });

    function doCheckin(){
      if (todayChecked.value) return;
      checkedDays.value.push(now.getDate());
      saveLS("spsm_checkin_" + y + "_" + m, checkedDays.value);
      showToast("Check-in successful");
    }

    return { dows, monthLabel, cells, todayChecked, checkedCount, doCheckin };
  }
};

   ============================================================ */
const SettingsFeedback = {
  components: { IconSvg },
  template: `
    <div class="screen no-safe">
      <div class="top-bar">
        <button class="back-btn" @click="$router.back()"><IconSvg name="back" /></button>
        <h1>Feedback</h1>
      </div>
      <div class="card">
        <div class="field"><label>Title</label><input class="input" v-model="title" placeholder="Short summary"></div>
        <div class="field"><label>Message</label><textarea class="input" v-model="body" placeholder="Describe your feedback"></textarea></div>
        <button class="btn primary block" :disabled="!canSend" @click="send">Send</button>
      </div>
    </div>
  `,
  setup(){
    const router = useRouter();
    const title = ref("");
    const body = ref("");
    const canSend = computed(function(){ return title.value.trim().length > 0 && body.value.trim().length > 0; });

    function send(){
      if (!canSend.value) return;
      showToast("Feedback sent successfully");
      title.value = "";
      body.value = "";
      router.back();
    }
    return { title, body, canSend, send };
  }
};

/* ============================================================
   ROUTER
   ============================================================ */
const routes = [
  { path: "/",            redirect: "/loading" },
  { path: "/loading",     component: LoadingPage,          meta: { hideTab: true } },
  { path: "/home",        component: HomePage,             meta: { tab: true } },
  { path: "/toolbox",     component: ToolboxPage,          meta: { tab: true } },
  { path: "/settings",    component: SettingsPage,         meta: { tab: true } },
  { path: "/stock/:sym",  component: StockDetailPage,      meta: { hideTab: true } },
  { path: "/rank/:key",   component: RankingPage,          meta: { hideTab: true } },
  { path: "/guide",       component: GuidePage,            meta: { hideTab: true } },
  { path: "/tool/:key",   component: ToolPage,             meta: { hideTab: true } },
  { path: "/settings/version",  component: SettingsVersion,  meta: { hideTab: true } },
  { path: "/settings/privacy",  component: SettingsPrivacy,  meta: { hideTab: true } },
  { path: "/settings/terms",    component: SettingsTerms,    meta: { hideTab: true } },
  { path: "/settings/team",     component: SettingsTeam,     meta: { hideTab: true } },
  { path: "/settings/checkin",  component: SettingsCheckin,  meta: { hideTab: true } },
  { path: "/settings/feedback", component: SettingsFeedback, meta: { hideTab: true } },
  { path: "/settings/inbox",    component: SettingsInbox,    meta: { hideTab: true } },
  { path: "/:pathMatch(.*)*", redirect: "/home" }
];

const router = createRouter({
  history: createWebHashHistory(),
  routes: routes
});

/* ============================================================
   ROOT APP
   ============================================================ */
const App = {
  components: { TabBar, IconSvg },
  template: `
    <div class="app-shell">
      <div class="page-area" :class="{ 'no-tab': !showTab }">
        <router-view v-slot="{ Component }">
          <transition name="fade" mode="out-in">
            <component :is="Component" />
          </transition>
        </router-view>
      </div>
      <TabBar v-if="showTab" />
      <transition name="fade">
        <div v-if="toast.visible" class="toast">{{ toast.msg }}</div>
      </transition>
    </div>
  `,
  setup(){
    const route = useRoute();
    const showTab = computed(function(){
      const t = route.meta && route.meta.tab;
      return !!t;
    });
    return { showTab, toast: toastState };
  }
};

const app = createApp(App);
app.component("IconSvg", IconSvg);
app.use(router);
router.isReady().then(function(){
  app.mount("#app");
  if (location.hash === "" || location.hash === "#"){
    router.replace("/loading");
  }
});
</script>
